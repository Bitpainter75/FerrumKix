name: Release

on:
  workflow_dispatch:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Das automatisch ausgestellte Token darf ausschliesslich Releases dieses oeffentlichen
# Repositories anlegen bzw. aktualisieren. Das Packaging-Repo wird nur lesend per Deploy-Key
# ausgecheckt.
permissions:
  contents: write

jobs:
  linux:
    name: AppImage, ZIP, DEB und RPM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bitpainter75/FerrumKix-Build
          path: packaging
          ssh-key: ${{ secrets.PACKAGING_DEPLOY_KEY }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Werkzeuge
        run: |
          sudo apt-get update
          sudo apt-get install -y zip desktop-file-utils rpm

      - name: AppImage
        run: packaging/package.sh appimage
        env:
          FERRUMKIX_BUILD_BOX: ""

      - name: Linux-ZIP
        run: packaging/package.sh zip
        env:
          FERRUMKIX_BUILD_BOX: ""

      - name: DEB
        run: packaging/package.sh deb
        env:
          FERRUMKIX_BUILD_BOX: ""

      - name: RPM
        run: packaging/package.sh rpm
        env:
          FERRUMKIX_BUILD_BOX: ""

      - name: Ins Latest-Release
        run: packaging/publish-github-release.sh --only-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
